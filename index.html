small><div class="money">${won(r.total)}</div><div class="yearbar"><i style="width:${p/den*100}%"></i><b style="width:${n/den*100}%"></b></div><div class="yearline"><small>원금 ${won(r.principal)}</small><small style="color:#a64e61">이자 ${won(r.interest)}</small></div></div>`}).join('')+`<div class="card"><small>매년 12월 31일 기준 · 만기 수령액 계속 보유 · 미납 과거 회차 제외 · 미래 정상 납입 및 금리 유지 가정 · 연결된 재예치 자금 우선 사용 · 일반과세 15.4%</small></div>`;}

function render(){oldRender();let active=data.filter(a=>!a.status), rows=[];for(let a of active)for(let i=0;i<a.months;i++){let date=due(a,i);if(date.slice(0,7)===month){let actual=a.payments.filter(p=>p.date.slice(0,7)===month).reduce((s,p)=>s+p.amount,0);rows.push({a,date,actual})}}let total=rows.reduce((s,r)=>s+r.a.monthly,0),left=rows.reduce((s,r)=>s+Math.max(0,r.a.monthly-r.actual),0);drawCalendar(rows,total,left,active);drawAnnual(active);if(tab==='wind')drawWind();let sum=active.reduce((s,a)=>s+paid(a),0),levels=[0,1000000,5000000,10000000,50000000,100000000],names=['새싹 부자','아기 복돈이','통통 복돈이','황금 복돈이','부자 복돈이','복돈이 왕국'],icons=['🐣','🐷','🐖','💰','👑','🏰'];$('collection').innerHTML='<div class="card"><h2>황금 돼지 도감</h2><div class="grid">'+levels.map((v,i)=>`<div class="card" style="opacity:${sum>=v?1:.45}"><h2>${icons[i]} ${names[i]}</h2>${won(v)} · ${sum>=v?'획득':'잠김'}</div>`).join('')+'</div></div><div class="card"><h2>🏆 업적</h2>'+[[data.length>0,'첫 적금'],[data.some(a=>a.status==='정상 만기'),'첫 만기'],[sum>=1000000,'100만원 모으기'],[sum>=10000000,'천만원 모으기'],[data.some(a=>a.renewedFrom),'재예치 성공']].map(([ok,n])=>`<p>${ok?'🏅':'🔒'} ${n}</p>`).join('')+'</div>';document.querySelectorAll('#vault button,#add button,#restore').forEach(b=>b.disabled=role==='viewer'||role==='locked');}
$('compare').innerHTML='<div class="card"><h2>🧮 직접 입력 금리 비교</h2><div id="compareRows"></div><button onclick="compareAdd()">상품 추가</button><div id="compareResult"></div></div>';function compareAdd(){let el=document.createElement('div');el.className='card';el.innerHTML='<label>상품명<input value="상품"></label><label>월 납입액<input type="number" min="1" value="500000"></label><label>개월<input type="number" min="1" value="12"></label><label>기본 연 이율<input type="number" min="0" step=".01" value="3.5"></label><label>우대 이율<input type="number" min="0" step=".01" value="0"></label><button class="muted" type="button">삭제</button>';el.oninput=compareCalc;el.querySelector('button').onclick=()=>{el.remove();compareCalc()};$('compareRows').append(el);compareCalc()}function compareCalc(){let rows=[...$('compareRows').children].map(el=>{let [name,m,n,r,e]=[...el.querySelectorAll('input')].map(x=>x.value);return {name,...calc({monthly:Math.max(0,+m),months:Math.max(0,+n),rate:Math.max(0,+r),extra:Math.max(0,+e)})}}).sort((a,b)=>b.net-a.net);$('compareResult').innerHTML=rows.map(a=>`<p>${esc(a.name)} · 세후 이자 ${won(a.net)} · 수령액 ${won(a.total)}</p>`).join('')}compareAdd();compareAdd();
$('compare').insertAdjacentHTML('afterbegin',`<div class="card"><h2>🐷 시중은행 적금 금리 비교</h2><p>최신 공시 금리는 아래 공식 사이트에서 확인하세요. 인증키 없이 직접 자동 조회할 수 있는 데이터 연결은 아직 제공되지 않습니다.</p><a class="rateLink" href="https://finlife.fss.or.kr/" target="_blank" rel="noopener">금융상품 한눈에 ↗</a><a class="rateLink" href="https://portal.kfb.or.kr/" target="_blank" rel="noopener">은행연합회 금리 비교 ↗</a><h3>확인한 금리 비교표</h3><label>가입 기간<select id="bankTerm"><option value="0">전체</option><option>6</option><option selected>12</option><option>24</option><option>36</option></select></label><label>은행명<input id="bankName" placeholder="예: 국민은행"></label><label>상품명<input id="bankProduct"></label><label>기간(개월)<input id="bankMonths" type="number" min="1" value="12"></label><label>기본금리(%)<input id="bankBase" type="number" min="0" step="0.01"></label><label>최고금리(%)<input id="bankMax" type="number" min="0" step="0.01"></label><button onclick="addBankRate()">비교표에 추가</button><div id="bankTable"></div><small>직접 확인한 금리만 표시됩니다. 약정금리는 변경되지 않습니다. 비교표는 현재 기기에만 저장됩니다.</small></div>`);

function addBankRate(){let name=$('bankName').value.trim(),product=$('bankProduct').value.trim(),term=+$('bankMonths').value,base=+$('bankBase').value,max=+$('bankMax').value;if(!name||!product||!Number.isInteger(term)||term<1||!$('bankBase').value||!$('bankMax').value||base<0||max<base||!Number.isFinite(max)){alert('상품명, 기간, 기본금리와 최고금리를 확인하세요.');return}bankRates.push({name,product,term,base,max,date:today()});saveBankRates()}

function windAssign(id){if(!canEdit())return;const a=data.find(x=>x.id===id);if(!a||a.months!==12||a.status)return;const v=prompt('매년 추가할 월 납입액 (원)',a.wind?.step??150000);if(v===null||!Number.isSafeInteger(+v)||+v<=0)return;const reinvest=confirm('만기 이자도 재투자할까요? 확인: 원금+이자 / 취소: 원금만');a.wind={step:+v,reinvest};save()}

function windForecast(records,years){const out={};for(const original of records){let a={...original};for(let i=0;i<years;i++){const c=calc(a),d=maturity(a),y=d.getFullYear(),g=out[y]??={total:0,net:0,external:0,items:0};g.total+=c.total;g.net+=c.net;g.items++;const pool=a.wind.reinvest?c.total:c.p;const next=windNext(a,pool);g.external+=next.external;a={...a,start:d.toLocaleDateString('sv-SE'),monthly:next.monthly};}}return Object.entries(out).sort((a,b)=>+a[0]-+b[0]);}
let windYears=5;function drawWind(){const active=data.filter(a=>!a.status&&a.wind&&a.months===12),eligible=data.filter(a=>!a.status&&!a.wind&&a.months===12),ended=data.filter(a=>a.wind&&a.status==='정상 만기'&&!data.some(x=>x.renewedFrom===a.id));const editable=role==='owner'||role==='local';const groups=windForecast(active,windYears),max=Math.max(1,...groups.map(([y,g])=>g.total));$('wind').innerHTML=`<div class="card"><div class="millHead"><svg class="tinyMill" viewBox="0 0 110 110" role="img" aria-label="돌아가는 작은 풍차"><ellipse cx="55" cy="101" rx="46" ry="6" fill="#e3e9c6"/><path d="M37 53H73L82 100H28Z" fill="#f6d5a6" stroke="#bd9066" stroke-width="2"/><path d="M29 55L55 29L81 55Z" fill="#efa6ae" stroke="#bd7880" stroke-width="2"/><rect x="48" y="80" width="14" height="20" rx="7" fill="#b98765"/><circle cx="55" cy="65" r="6" fill="#fff6ce"/><g class="millBlades" fill="#fff7e1" stroke="#bd9066" stroke-width="1.5"><path transform="rotate(0 55 46)" d="M53 45L53 5Q63 1 70 8L61 39Z"/><path transform="rotate(90 55 46)" d="M53 45L53 5Q63 1 70 8L61 39Z"/><path transform="rotate(180 55 46)" d="M53 45L53 5Q63 1 70 8L61 39Z"/><path transform="rotate(270 55 46)" d="M53 45L53 5Q63 1 70 8L61 39Z"/></g><circle cx="55" cy="46" r="5" fill="#e8b452"/><circle cx="90" cy="90" r="10" fill="#f5b4bd"/><path d="M82 85L80 76L87 81M94 81L101 76L99 86" fill="#f5b4bd"/><ellipse cx="90" cy="94" rx="5" ry="3" fill="#e78d9d"/><circle cx="86" cy="88" r="1"/><circle cx="94" cy="88" r="1"/></svg><div><h2>복돈이의 작은 풍차</h2><small>한 달 한 달, 행복이 쌓여요!</small></div></div><div class="windwheel">${Array.from({length:12},(_,i)=>`<span class="${active.some(a=>new Date(a.start+'T12:00:00').getMonth()===i)?'on':''}">${i+1}월</span>`).join('')}</div><p>운영 중 ${active.length}개 · 월 약정 납입 ${won(active.reduce((s,a)=>s+a.monthly,0))}</p><small>색상은 가입월 기준 · 만기 자금은 재가입 후 분할 사용한다고 가정</small></div>${active.map(a=>{const c=calc(a),n=windNext(a,a.wind.reinvest?c.total:c.p);return `<div class="card"><h2>${esc(a.name)}</h2><p>월 ${won(a.monthly)} → ${won(n.monthly)}</p><small>${a.wind.reinvest?'원금+이자':'원금만'} 재투자 · 다음 주기 월평균 신규 부담 ${won(n.external/12)}</small>${editable?`<div class="actions"><button onclick="windAssign('${a.id}')">설정 수정</button><button class="muted" onclick="windRemove('${a.id}')">풍차 해제</button></div>`:''}</div>`}).join('')}${editable&&!eligible.length&&!active.length?'<div class="card"><p>진행 중인 12개월 적금을 등록하면 풍차로 지정할 수 있어요.</p><button type="button" onclick="newSaving()">+ 적금 등록</button></div>':''}${editable?eligible.map(a=>`<div class="card">${esc(a.name)} <button onclick="windAssign('${a.id}')">풍차 지정</button></div>`).join(''):''}${ended.map(a=>`<div class="card">${esc(a.name)} · 만기 완료 ${editable?`<button onclick="windRenew('${a.id}')">풍차 재가입</button>`:''}</div>`).join('')}<div class="card"><h2>연도별 풍차 예상</h2><label>예측 주기<select onchange="windYears=+this.value;drawWind()">${[1,3,5,10,20].map(n=>`<option value="${n}" ${n===windYears?'selected':''}>${n}년</option>`).join('')}</select></label><small>현재 등록된 풍차만 반복 재가입 · 금리 유지 · 일반과세 · 연도별 만기액은 재투자 원금을 포함한 현금흐름이며 순자산이 아닙니다.</small>${groups.map(([y,g])=>`<div class="yearitem"><b>${y}년 · ${g.items}건</b><div class="money">${won(g.total)}</div><div class="bar"><i style="width:${g.total/max*100}%"></i></div><small>세후 이자 ${won(g.net)} · 해당 만기 후 다음 주기 신규 부담 ${won(g.external)}</small></div>`).join('')||'<p>12개월 적금을 풍차로 지정해 주세요.</p>'}</div>`}
